<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Modificando HTML #01</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
  </head>

  <body class="conteudo exercicio">
    <h1>Modificando HTML #01</h1>
    <div id="conteudo1"></div>
    <div id="conteudo2"></div>
    <div id="conteudo3"></div>
    <div>SEM ID</div>

    <script>
      // Conteudo 1
      // Adicionamos no conteudo o elemento <p>1</p>
      $("#conteudo1").append("<p>1</p>");

      // Conteudo 2
      const elementos = [
        $("<li></li>").append("Mario"),
        $("<li>").append("Sonic"),
        $("<li>").append("Zelda"),
      ];
      // O prepend adiciona antes de tudo, e mesmo tendo varios elementos ele faz o append normalmente
      const lista = $("<ul><li>Terraria</li></ul>").prepend(elementos);

      $("#conteudo2").append(lista);

      // Conteudo 3
      // Podemos fazer o append de varias maneiras, mas todas fazem o mesmo resultado
      $("#conteudo3")
        .append(["<h1>1</h1>", "<h1>2</h1>"])
        .prepend("<h1>0</h1>");
      // $("#conteudo3").append("<h1>1</h1>", "<h1>2</h1>").prepend("<h1>0</h1>")
      // $("#conteudo3").append("<h1>1</h1>").append("<h1>2</h1>").prepend("<h1>0</h1>")

      // Ao usamos o HTML ele substitui o html anterior por esse, e o text é so o texto, então ele vai mostar o <h1> junto
      $("#conteudo3").html("<h1>HTML</h1>");
      $("#conteudo3").text("<h1>Text</h1>");

      $("div[id]").html("<h1>Todos!</h1>");
    </script>
  </body>
</html>
