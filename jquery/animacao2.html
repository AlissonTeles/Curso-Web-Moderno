<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Animação #02</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
    <style>
      body {
        position: relative;
        background-color: #999;
        color: #000;
      }

      div {
        position: absolute;
        display: inline;
        border: solid 10px #000;
        padding: 50px;
        font-size: 3em;
        background-color: crimson;
      }
    </style>
  </head>

  <body>
    <div>Animar!</div>

    <script>
      // Atraves do "animate" nos podemos criar nossas proprias animações colocando o que queremos animar e a duração
      async function alterarTamanho(valor, duracao) {
        new Promise((resolve, reject) => {
          $("div").animate({ width: `+=${valor}` }, duracao);
        });
      }

      async function alterarDiagonal(valor, duracao) {
        new Promise((resolve, reject) => {
          $("div").animate({ top: `+=${valor}`, left: `+=${valor}` }, duracao);
        });
      }

      async function alterarGiro(valor, duracao) {
        new Promise((resolve, reject) => {
          $("div").animate(
            { transform: `+=${valor}` },
            {
              duration: duracao,
              step: function (valor) {
                $(this).css(`transform`, `rotate(${valor}deg)`);
              },
            },
            "linear"
          );
        });
      }

      alterarTamanho(300, 100)
        .then(alterarTamanho(-300, "slow"))
        .then(alterarDiagonal(300, 1000))
        .then(alterarGiro(1000000, 1000));

      //   alterarTamanho(300, 100, () => {
      //     alterarTamanho(-300, "slow", () => {
      //       alterarDiagonal(300, 1000, () => {
      //         alterarGiro(1000000, 1000, () => {});
      //       });
      //     });
      //   });
    </script>
  </body>
</html>
