<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Eventos #03</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
    <style>
      input {
        font-size: 2em;
      }

      #resultado {
        display: flex;
        flex-direction: row;
      }
    </style>
  </head>

  <body class="conteudo exercicio">
    <h1>Eventos #03</h1>
    <div id="div1">1</div>
    <div id="div2">2</div>
    <input id="input1" type="text" placeholder="Digite Algo!" />
    <span id="resultado"></span>

    <script>
      function mostrarDadosEvento(e) {
        $("#resultado").empty();

        const div1 = $("<div>");
        const div2 = $("<div>");
        $("#resultado").append(div1, div2);

        div1.append(`Target: ${e.target.id}`);
        // Seria o alvo relacionado a ele depdendendo do evento (no caso das divs o body, mas do input nada)
        const rlt = e.relatedTarget ? e.relatedTarget.tagName : null;
        div1.append(`<br>Related Target: ${rlt}`);

        div1.append(`<br>Type: ${e.type}`);
        div1.append(`<br>Which: ${e.which}`);
        div1.append(`<br>MetaKey: ${e.metaKey}`);

        div2.append(`PageX: ${e.pageX}`);
        div2.append(`<br>PageY: ${e.pageY}`);
        div2.append(`<br>ClientX: ${e.clientX}`);
        div2.append(`<br>ClientY: ${e.clientY}`);
        const obs = e.data ? e.data.obs : null;
        const teste = e.data ? e.data.teste : null;
        div2.append(`<br>Obs: ${obs}`);
        div2.append(`<br>Obs: ${teste}`);
      }

      $("#div1, #div2").on(
        "mouseenter mouseleave",
        {
          obs: "Funcionoou",
          teste: "Sim",
        },
        mostrarDadosEvento
      );
      $("#input1").keyup(mostrarDadosEvento);
    </script>
  </body>
</html>
