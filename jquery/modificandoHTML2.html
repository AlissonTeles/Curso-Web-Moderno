<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Modificando HTML #02</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
  </head>

  <body class="conteudo exercicio">
    <h1>Modificando HTML #02</h1>
    <div id="div1">1</div>
    <div id="div2">2</div>
    <div id="div3">3</div>
    <p class="numero">4</p>
    <p class="numero">5</p>

    <script>
      $("#div1").append(", 2");
      $("#div1").prepend("0, ");

      // Aqui nos passamos o que queremos primeiro antes do seletor
      $("<span>, 3</span>").appendTo("#div1");
      $("<span>-1, </span>").prependTo("#div1");

      // Aqui estamos adicionando antes e depois do seletor
      $("#div2").before("<p>Antes 2</p>");
      $("#div2").after("<p>depois 2</p>");

      // Aqui nos passamos o que queremos primeiro antes do seletor
      $("<p>Antes de 3</p>").insertBefore("#div3");
      $("<p>Depois de 3</p>").insertAfter("#div3");

      // O wrap ele amarra cada item do selector, exemplo cada <p> teria um <div><p></div>
      //$("p.numero").wrap("<div>");
      // Agora no wrapAll, ele vai juntar todos em um so e não em cada um então caso tenha 2 <p> ele ficaria <div><p></p><p></p></div>
      $("p.numero").wrapAll("<div id='div4'></div>");
      $("#div4").empty();

      $("#div3, #div4").prev().remove();

      // Aqui o replaceWith ele substitui com o valor novo que estamos colocando
      //$("<div>Substituto</div>").replaceAll("body > p");
      //$("body > p").replaceWith("<div>Substituto</div>");
      $("body > p").replaceWith(function () {
        return $("<div>").html($(this).html()).append("!!!");
      });
    </script>
  </body>
</html>
