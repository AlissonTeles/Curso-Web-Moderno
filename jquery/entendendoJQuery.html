<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Entendendo jQuery</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
  </head>

  <body class="conteudo exercicio">
    <h1>Entendendo jQuery</h1>
    <div>1</div>
    <div>2</div>

    <script>
      // $("div") cria um conjunto de elementos que dentro deles tem o elemento DOM
      $("div").hide(5000).show(5000).fadeOut(5000);
      // Podemos pegar o elemento DOM
      console.log($("div").get(0));
      // Podemos chamar pelo $ ou jQuery
      console.log(jQuery("div").get(1));

      // Metodos do proprio jQuery
      console.log($.isEmptyObject({}));
      console.log($.isEmptyObject({ nome: null }));
      console.log($.inArray(3, [1, 3, 2]));

      $.fn.fundoVerde = function () {
        this.css("background-color", "green");
        return this; // Precisa retornar para podemos fazer metodos jQuery
      };

      $("body").fundoVerde().fadeOut(5000);
    </script>
  </body>
</html>
