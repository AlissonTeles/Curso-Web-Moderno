<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Manipulando CSS</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
  </head>

  <body class="conteudo exercicio">
    <h1>Manipulando CSS</h1>
    <div id="div1">1</div>
    <div id="div2">2</div>
    <div id="resultado"></div>
    <script>
      // Atraves do método CSS, nos conseguimos pegar valores, alterar eles, alterar multiplos valores ou até criar callbacks dentro dela
      const fonte = $("#div1").css("font-family");
      $("#resultado").html(`A fonte é ${fonte}`);

      $("#div1").css("font-size", "2.5em");
      $("#div1").css({ "font-size": "3em", color: "yellow" });
      $("#div1").css("font-size", function () {
        return `${2 * 2}em`;
      });

      // Aqui mostramos que podemos adicionar classes, remover, ver se existe, e o toggle (desativa se tiver ativo, e ativa caso esteja desativado)
      $("#div2").addClass("destaque");
      const temClass = $("#div2").hasClass("destaque");
      $("#resultado").append(`<br>Tem classe ? ${temClass}`);

      $("#div2").removeClass("destaque");
      $("#div2").toggleClass("destaque");
      $("#div2").toggleClass("destaque");
    </script>
  </body>
</html>
