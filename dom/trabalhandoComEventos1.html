<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Trabalhando com Eventos #01</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body class="conteudo exercicio">
    <div>
      <!-- Podemos usar o onclick="navegarEm5s(event)"-->
      <a espera href="https://google.com.br">Google</a>
    </div>
    <script>
      function navegarEm5s(e) {
        e.preventDefault(); // Ele preveni a ação do evento original no caso do <a>
        setTimeout(() => {
          const link = e.target;
          window.location.href = link; // Target é o elemento afetadp
        }, 5000);
      }

      // Podemos fazer dessa maneira, assim não iamos precisar mudar em cada um deles
      const a = document.querySelector("a");
      a.onclick = navegarEm5s;
      // Aqui podemos fazer ainda mais direto com uma propriedade customizada
      const b = document.querySelector("[espera]");
      b.onclick = navegarEm5s;
    </script>
  </body>
</html>
