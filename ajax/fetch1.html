<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Fetch API #01</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body class="conteudo exercicio">
    <h1>Estados</h1>

    <script>
      const url = "dados/estados.json";
      const teste = fetch(url)
        .then((dados) => dados.json())
        .then((estados) => {
          var lista = Array.from(estados).reduce(
            (html, estado) => html + `<li>${estado.nome}</li>`,
            ""
          );
          document.body.insertAdjacentHTML("beforeend", lista);
        });
    </script>
  </body>
</html>
