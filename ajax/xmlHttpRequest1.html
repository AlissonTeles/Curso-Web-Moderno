<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>XMLHttpRequest #01</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body class="conteudo exercicio">
    <h1>Estados</h1>

    <script>
      function ajax(config) {
        const xhr = new XMLHttpRequest();
        xhr.open(config.metodo, config.url, true);
        xhr.onload = (e) => {
          if (xhr.status == 200) {
            config.sucesso(xhr.response);
          } else if (xhr.status > 400) {
            config.erro({
              status: xhr.status,
              texto: xhr.statusText,
            });
          }
        };

        xhr.send();
      }

      ajax({
        metodo: "GET",
        url: "dados/estados.json",
        sucesso(estados) {
          const states = JSON.parse(estados);
          criarTabela(states);
        },
        erro(status, texto) {
          const errText = `Erro: ${status} ${texto}`;
          document.body.appendChild(errText);
        },
      });

      function criarTabela(states) {
        const linhas = states.map((estado) => {
          const tdId = document.createElement("td");
          tdId.innerHTML = estado.id;

          const tdNome = document.createElement("td");
          tdNome.innerHTML = estado.nome;

          const tdSigla = document.createElement("td");
          tdSigla.innerHTML = estado.sigla;

          const trRow = document.createElement("tr");
          trRow.appendChild(tdId);
          trRow.appendChild(tdNome);
          trRow.appendChild(tdSigla);
          return trRow;
        });

        const table = document.createElement("table");
        linhas.forEach((linha) => {
          table.appendChild(linha);
        });

        document.body.appendChild(table);
      }
    </script>
  </body>
</html>
