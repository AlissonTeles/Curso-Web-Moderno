<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Mini SPA</title>
    <link rel="stylesheet" href="../css/estilo.css" />
    <style>
      nav {
        font-size: 2em;
      }

      nav a {
        text-decoration: none;
        color: #fff;
        padding: 0 10px;
      }
    </style>
  </head>

  <body class="conteudo">
    <nav>
      <a href wm-link="series.html" wm-destino=".pagina">Séries</a> |
      <a href wm-link="linguagens.html" wm-destino=".pagina">Linguagens</a>
    </nav>
    <div class="pagina"></div>
    <script>
      function carregarLink(url, destino, push = true) {
        if (!url || !destino) return;
        const divPagina = document.querySelector(destino);
        fetch(url)
          .then((res) => res.text())
          .then((html) => {
            divPagina.innerHTML = html;
            history.pushState({ destino }, "", url);
          });
      }

      document.querySelectorAll("[wm-link]").forEach((link) => {
        console.log(link);
        const url = link.getAttribute("wm-link");
        const destino = link.getAttribute("wm-destino");

        link.onclick = (e) => {
          e.preventDefault();
          carregarLink(url, destino);
        };
      });

      window.onpopstate = (e) => {
        if (e.state) {
          carregarLink(window.location.href, e.state.destino, false);
        }
      };
    </script>
  </body>
</html>
