<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>XMLHttpRequest #03</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body class="conteudo exercicio">
    <h1>Estados</h1>

    <script>
      function ajaxStates(config) {
        const xhr = new XMLHttpRequest();
        xhr.open(config.method, config.url, true);

        xhr.onreadystatechange = (e) => {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              config.sucesso(xhr.responseXML);
            } else if (xhr.status >= 400) {
              config.error({ code: xhr.status, msg: xhr.statusText });
            }
          }
        };

        xhr.send();
      }

      ajaxStates({
        method: "GET",
        url: "dados/estados.xml",
        sucesso(resp) {
          const states = resp.getElementsByTagName("estado");
          const itens = Array.from(states).reduce(
            (html, state) => html + `<li>${state.attributes.nome.value}</li>`,
            ""
          );

          console.log(itens);

          document.body.insertAdjacentHTML("beforeend", `<ul>${itens}</ul>`);
        },
        error(e) {
          const msg = document.createTextNode(`${e.code} - ${e.msg}`);
          document.body.appendChild(msg);
        },
      });
    </script>
  </body>
</html>
