<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Ajax com jQuery</title>
    <link rel="stylesheet" href="css/estilo.css" />
    <script src="js/jquery.js"></script>
  </head>

  <body class="conteudo exercicio">
    <h1>jQuery Get/Post</h1>
    <div id="get"></div>
    <div id="post"></div>

    <script>
      function showValueById(id, data) {
        const texto = JSON.stringify(data);
        document.getElementById(id).innerHTML = texto;
      }

      $.ajax("parOuImpar", {
        data: {
          numero: 3,
        },
        success(res) {
          showValueById("get", res);
        },
      });

      $.ajax("formulario", {
        data: {
          nome: "Alisson",
          idade: 20,
        },
        method: "post",
        success(res) {
          showValueById("post", res);
        },
        error(err) {
          showValueById("post", err);
        },
      });
    </script>
  </body>
</html>
